# Taxi Cyprus beta — cyprustaxi.ackedberryes.store (fronted by Cloudflare)
# Proxies ONLY this hostname to the isolated app on 127.0.0.1:8097.
map $http_upgrade $taxicy_conn_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen 443 ssl http2;
    server_name cyprustaxi.ackedberryes.store;

    ssl_certificate     /etc/nginx/taxicy-ssl/taxicy.crt;
    ssl_certificate_key /etc/nginx/taxicy-ssl/taxicy.key;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $taxicy_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}

# IL-Yas production domain — il-y.taxi (+ www). Proxies ONLY these hostnames to the
# isolated app on 127.0.0.1:8097. Same origin cert as the beta vhost (works behind
# Cloudflare "Full"); replace with a domain-valid cert if the origin is exposed directly.
map $http_upgrade $ilytaxi_conn_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen 443 ssl http2;
    server_name il-y.taxi www.il-y.taxi;

    ssl_certificate     /etc/nginx/taxicy-ssl/taxicy.crt;
    ssl_certificate_key /etc/nginx/taxicy-ssl/taxicy.key;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ilytaxi_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
